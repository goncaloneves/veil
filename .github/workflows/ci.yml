name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun run build:adapters
      - name: Load each adapter the way its agent does
        run: |
          node --input-type=module -e "const m = await import('./dist/veil-pi.js'); if (typeof m.default !== 'function') process.exit(1)"
          bun -e "const m = await import('./dist/veil-opencode.js'); if (typeof m.default?.server !== 'function') process.exit(1)"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm install --global @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin test .

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node scripts/sync-gitleaks.ts
      - run: git diff --exit-code src/rules/gitleaks.ts scripts/gitleaks-version.txt
