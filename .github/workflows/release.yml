name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Run CI on the release pull request
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: gh workflow run ci.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, run: true }
          - { os: ubuntu-latest, target: linux-arm64, run: false }
          - { os: ubuntu-latest, target: linux-x64-musl, run: false }
          - { os: ubuntu-latest, target: linux-arm64-musl, run: false }
          - { os: macos-latest, target: darwin-arm64, run: true }
          - { os: macos-latest, target: darwin-x64, run: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun build src/cli/main.ts --compile --minify --target="bun-${{ matrix.target }}" --outfile "veil-${{ matrix.target }}"
      - name: Sign the macOS build
        if: startsWith(matrix.target, 'darwin')
        run: |
          codesign --force --sign - "veil-${{ matrix.target }}"
          codesign --verify "veil-${{ matrix.target }}"
      - name: Run the build
        if: matrix.run
        run: ./veil-${{ matrix.target }} version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: veil-${{ matrix.target }}
          path: veil-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum veil-* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/veil-*
      - run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  pin-marketplace:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Point the marketplace at the release
        run: node scripts/pin-marketplace.ts "$TAG"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git diff --cached --quiet || { git commit -m "chore(release): pin the marketplace to $TAG"; git push; }
