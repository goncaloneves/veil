name: sync gitleaks rules

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/sync-gitleaks.ts --latest
      - id: version
        run: echo "tag=$(cat scripts/gitleaks-version.txt)" >> "$GITHUB_OUTPUT"
      - run: npm test
      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: chore/gitleaks-rules
          delete-branch: true
          commit-message: "feat(rules): update the gitleaks rules to ${{ steps.version.outputs.tag }}"
          title: "feat(rules): update the gitleaks rules to ${{ steps.version.outputs.tag }}"
          body: "Generated by the weekly sync (`node scripts/sync-gitleaks.ts --latest`). The tests passed on the new rules."
      - name: Run CI on the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref chore/gitleaks-rules --repo "$GITHUB_REPOSITORY"
