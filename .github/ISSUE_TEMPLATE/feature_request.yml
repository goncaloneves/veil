name: Feature request
description: A source, an agent, or a behaviour veil should support
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The secret or the agent, and where it leaks today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How veil could handle it
